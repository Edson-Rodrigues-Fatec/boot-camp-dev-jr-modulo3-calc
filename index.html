<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
      <div class="calculator">
             <object data="calculate_black_48dp.svg" type="image/svg+xml"></object>
             <div class="calc-title">Calculadora</div>
             
             <input id="n1" type="number" placeholder="Primeiro número"/>
             <input id="n2" type="number" placeholder="Segundo número"/>
            
              <div>
               <button onclick="calc('+')">+</button>
               <button onclick="calc('-')">-</button>
               <button onclick="calc('*')">*</button>
               <button onclick="calc('/')">/</button>
              </div>

            <input id="saida" readonly/>
   </div>

      <div  class="history">
               <div class="history-title"><h1>Histórico :</h1></div>
               <div class="last-operation"><small>10 últimas operações executadas :</small>
               <div id="history">    </div></div>
               
      </div>
  </div>

        <script src="script.js"></script>
</body>
</html>
