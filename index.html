<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <div class="calculator">
        <object data="calculate_black_48dp.svg" type="image/svg+xml"></object>
       <h1>Calculadora</h1>
       <input id="n1" type="number" placeholder="Primeiro número"/>
       <input id="n2" type="number" placeholder="Segundo número"/>
       <div>
       <button onclick="calc('+')">+</button>
       <button onclick="calc('-')">-</button>
       <button onclick="calc('*')">*</button>
       <button onclick="calc('/')">/</button>
       </div>
       <input id="saida" readonly/>
    </div>

    <div id="history" class="history">

    </div>
  </div>
 <script src="script.js"></script>
</body>
</html>
